<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mythoria — ouverture des booster</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[url('images/fond-ouvrir-boosters.jpg')] bg-cover bg-center bg-fixed text-white">
    <div class="min-h-screen bg-black/70">

        <header class="px-4 pt-3">
            <img src="images/logomythoriya-removebg-preview.png" alt="Logo Mythoria" class="mx-auto h-28 w-full max-w-sm object-contain">

            <nav class="mt-4 mb-6 flex justify-center">
                <ul class="flex flex-wrap justify-center gap-6 rounded-full border border-purple-600 bg-purple-800 px-8 py-3 text-lg font-bold shadow-lg">
                    <li><a href="index.html" class="hover:text-yellow-400">Accueil</a></li>
                    <li><a href="boutique.html" class="hover:text-yellow-400 transition-colors">Boutique</a></li>
                    <li><a href="ouverture.html" class="text-yellow-400 transition-colors">Ouverture</a></li>
                    <li><a href="macollection.html" class="hover:text-yellow-400 transition-colors">Mon grimoire</a></li>
                    <li><a href="deck.html" class="hover:text-yellow-400 transition-colors">Mon deck</a></li>
                </ul>
            </nav>
        </header>

<main class="max-w-6xl mx-auto px-4">
    <section class="text-center py-6"> <h1 class="text-3xl font-bold text-yellow-400">
            Opening Chamber
        </h1>

        <p class="mt-3 text-yellow-200">
            Ouvrez vos boosters et découvrez vos cartes !
        </p>

    </section>
    <section class="mt-6">

    <h2 class="text-2xl font-bold text-center mb-6">
        Mes boosters disponibles
    </h2>

    <div id="liste-boosters"
         class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
    </div>

</section>
 <p id="message"
 class="text-center text-yellow-400 text-xl mt-6"></p>
 <section id="zone-ouverture" class="hidden mt-10 text-center">

        <h2 class="text-2xl font-bold text-yellow-400 mb-5">
            Mes nouvelles cartes
        </h2>

        <img id="image-booster"
             alt="Booster"
             class="w-40 mx-auto hidden">
             <div id="cartes-obtenues"
     class="flex flex-wrap justify-center gap-4 mt-6">
</div>

        <a id="bouton-grimoire" href="macollection.html" class="hidden inline-block bg-yellow-400 text-black p-3 rounded mt-6 font-bold">
        voir mon grimoire
        </a>
  </section>
 </main>
 <footer class="py-8 text-center">
            <nav class="mb-4">
                <ul class="flex flex-wrap justify-center gap-6 font-bold">
                  <li><a href="index.html" class="hover:text-yellow-400">Accueil</a></li>
                    <li><a href="boutique.html" class="hover:text-yellow-400 transition-colors">Boutique</a></li>
                    <li><a href="ouverture.html" class="text-yellow-400 transition-colors">Ouverture</a></li>
                    <li><a href="macollection.html" class="hover:text-yellow-400 transition-colors">Mon grimoire</a></li>
                    <li><a href="deck.html" class="hover:text-yellow-400 transition-colors">Mon deck</a></li>
                </ul>
            </nav>
            <p class="text-gray-400">© 2026 Mythoria</p>
        </footer>
    </div>

        <script src="carte.js"></script>
<script src="ouverture.js"></script>

</body>
</html>
